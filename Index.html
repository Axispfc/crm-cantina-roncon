<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Faça seu pedido online na Cantina Roncon."
  >

  <title>Cantina Roncon | Pedidos Online</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-inicial">

    <div class="decoracao decoracao-superior-esquerda"></div>
    <div class="decoracao decoracao-superior-direita"></div>

    <section class="conteudo">

      <!-- LOGO -->
      <header class="cabecalho">

        <div class="logo-cantina" aria-label="Cantina Roncon">

          <div class="logo-circulo">

            <span class="logo-nome logo-nome-superior">
              CANTINA
            </span>

            <div class="logo-centro">
              <span class="vapor">♨</span>

              <div class="panela">
                <span class="coracao">♥</span>
              </div>
            </div>

            <span class="logo-nome logo-nome-inferior">
              RONCON
            </span>

          </div>

        </div>

        <p class="slogan">
          <span>★</span>
          SABOR QUE ACOLHE
          <span>★</span>
        </p>

      </header>

      <!-- BOTÃO PRINCIPAL -->
      <section class="area-pedido">

        <a
          href="cardapio.html"
          class="botao-pedido"
          aria-label="Acessar o cardápio e fazer pedido online"
        >
          <span class="icone-prato">♨</span>

          <span class="texto-botao">
            FAÇA SEU PEDIDO AQUI
          </span>

          <span class="seta-botao">›</span>
        </a>

      </section>

      
      <!-- CONTATOS -->
      <section class="informacoes">

        <div class="informacao-item">

          <div class="icone-informacao">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3c.3-.3.7-.4 1.1-.3
                1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1
                C11.4 21 3 12.6 3 2.3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1
                0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"
              />
            </svg>
          </div>

          <div class="informacao-texto">

            <span class="rotulo">
              FALE COM A CANTINA
            </span>

            <div class="telefones">
              <a href="tel:+551148255271">
                (11) 4825-5271
              </a>

              <span>/</span>

              <a href="tel:+5511975896502">
                (11) 97589-6502
              </a>
            </div>

          </div>

        </div>

        <div class="linha-divisoria"></div>

        <div class="informacao-item">

          <div class="icone-informacao">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7
                7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1
                12 6a2.5 2.5 0 0 1 0 5.5z"
              />
            </svg>
          </div>

          <div class="informacao-texto">

            <span class="rotulo">
              NOSSO ENDEREÇO
            </span>

            <a
              class="endereco"
              href="https://www.google.com/maps/search/?api=1&query=Av.+Francisco+Monteiro,+1080,+Ribeirão+Pires,+SP"
              target="_blank"
              rel="noopener noreferrer"
            >
              <strong>Ribeirão Pires</strong>
              <span>Av. Francisco Monteiro, 1080</span>
            </a>

          </div>

        </div>

      </section>

    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">

      <div class="selo">
        <span>COMIDA CASEIRA</span>
        <strong>♥</strong>
        <small>FEITA COM CARINHO</small>
      </div>

    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
